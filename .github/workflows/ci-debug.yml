name: ci-debug
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
env:
  SILO_CI_CACHE_FLAG: --build-cache
  SILO_CI_PARALLEL_FLAG: --parallel
  SILO_CI_CONFIGURATION_FLAG: --no-configuration-cache
jobs:
  compile:
    if: startsWith(github.head_ref, 'ci-debug/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6
        with:
          cache-read-only: false
      - name: Compile and test the TV app
        shell: bash
        run: |
          set +e
          ./gradlew -Dorg.gradle.jvmargs="-Xmx4g -Dfile.encoding=UTF-8" testDebugUnitTest "${SILO_CI_CACHE_FLAG}" "${SILO_CI_PARALLEL_FLAG}" "${SILO_CI_CONFIGURATION_FLAG}" --max-workers=2 > out.txt 2>&1
          status=$?
          grep -E "^e: |ERROR|What went wrong|> Task.*FAILED|^w: .*(Profile|LinkProfile|TvAppNavigation|MainTvActivity)|FAILED|Exception|AssertionError|expected:" out.txt | grep -v "^\s*at " | head -60 > errs.txt
          for f in */build/test-results/testDebugUnitTest/TEST-*.xml; do
            python3 - "$f" >> errs.txt <<'PY'
          import sys, xml.etree.ElementTree as ET
          s = ET.parse(sys.argv[1]).getroot()
          for c in s.findall('testcase'):
              for t in ('failure', 'error'):
                  e = c.find(t)
                  if e is not None:
                      print(f"TEST {c.get('classname')}.{c.get('name')}: {(e.get('message') or '')[:400]}")
          PY
          done
          head -40 out.txt >> errs.txt; tail -40 out.txt >> errs.txt
          body=$(python3 -c "import sys;print(open('errs.txt').read().replace('%','%25').replace('\r','').replace('\n','%0A'))")
          echo "::error title=ci-debug::${body}"
          exit $status
